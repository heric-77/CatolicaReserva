# Configuração da análise do SonarQube (servidor + cliente).
# Para rodar: .\scripts\analisar-sonar.ps1 (ver documentacao/SONAR.md)
sonar.projectKey=catolicareserva
sonar.projectName=CatólicaReserva
sonar.sourceEncoding=UTF-8

sonar.sources=server/src,client/src
sonar.tests=server/test,client/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Relatórios de cobertura gerados por "npm run test:coverage" em cada projeto.
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info
# Pontos de entrada que só ligam o sistema: não têm lógica para testar.
sonar.coverage.exclusions=server/src/server.js,client/src/main.jsx
